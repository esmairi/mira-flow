[project]
name = "mira-flow"
version = "0.1.0"
description = "Minimal event-driven workflow engine: jobs chained by broker topics, with a DB run ledger"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mira-flow-core",
    "mira-flow-ledger",
    "sqlalchemy>=2.0",
    "typer>=0.15",
]

# Forwards to mira-flow-ledger's own optional-dependencies — `uv sync
# --extra postgres` from here, rather than needing to sync inside
# packages/ledger directly.
[project.optional-dependencies]
postgres = ["mira-flow-ledger[postgres]"]

[tool.uv.sources]
mira-flow-core = { workspace = true }
mira-flow-ledger = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[project.scripts]
mira-flow = "mira_flow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "testcontainers>=4",
    "httpx>=0.27",
    "prek>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mira_flow"]

[tool.ruff]
line-length = 100
src = ["src", "packages/*/src", "tests"]
# Alembic-generated revision files — regenerated by `alembic revision
# --autogenerate`, not hand-styled; env.py/script.py.mako (hand-maintained
# or template, not generated data) stay linted.
extend-exclude = ["packages/ledger/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...)/fastapi.Depends(...)/fastapi.Query(...) as argument
# defaults are the idiomatic pattern for both frameworks, not the mutable-
# default-argument footgun B008 exists to catch.
extend-immutable-calls = ["typer.Option", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
