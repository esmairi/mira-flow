[project]
name = "mira-flow-ledger"
version = "0.1.0"
description = "Mira Flow: the workflow_run / task_run DB ledger — what happened (§1)"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
]

# One entry per supported database's driver — see db.py's `_engine_kwargs`
# for the other half of adding a new one (any dialect-specific
# create_engine() tuning).
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mira_flow"]
